name: Build (Windows)

on:
  push:
    branches: [ "master", "main", "sow/2026-Q2" ]
  pull_request:
    branches: [ "master", "main", "sow/2026-Q2" ]
  workflow_dispatch:

jobs:
  build:
    # Run only in SAM-BIM org; skip fork PRs because secrets are not available there
    if: |
      github.repository_owner == 'SAM-BIM' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)

    runs-on: windows-2022

    env:
      MSBUILDDISABLENODEREUSE: "1"
      ORG_NAME: "SAM-BIM"
      REPO_NAME: "SAM_Rhino_UI"
      NUGET_XMLDOC_MODE: "skip"

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ${{ env.REPO_NAME }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clone dependency repos (siblings)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.ORG_REPO_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:GH_TOKEN) {
            throw "Missing secret ORG_REPO_TOKEN. Add it in repo Settings -> Secrets and variables -> Actions."
          }

          $org   = '${{ env.ORG_NAME }}'
          $repo  = '${{ env.REPO_NAME }}'
          $token = $env:GH_TOKEN

          # Full dependency chain, plus private SAM_Solver.
          # Keep the current repo LAST.
          $buildOrder = @(
            'SAM'
            'SAM_Solver'
            'SAM_Systems'
            'SAM_Windows'
            'SAM_Mollier'
            'SAM_gbXML'
            'SAM_SolarCalculator'
            'SAM_Tas'
            'SAM_Excel'
            'SAM_GEM'
            'SAM_LadybugTools'
            'SAM_UI'
            $repo
          )

          # Clone everything except the last one (already checked out by Actions)
          $deps = $buildOrder[0..($buildOrder.Count-2)]
          foreach ($r in $deps) {
            if (Test-Path $r) { continue }
            $headRef = '${{ github.head_ref }}'
            $candidates = @()
            if ($headRef) { $candidates += $headRef }
            $candidates += 'sow/2026-Q2'
            # Use the auth-token form so private deps (e.g. SAM_Solver) don't prompt
            $url = if ($token) { "https://$token@github.com/$org/$r.git" } else { "https://github.com/$org/$r.git" }
            $cloned = $false
            foreach ($cand in $candidates) {
              $has = (git ls-remote --heads $url $cand 2>$null | Out-String).Trim()
              if ($has) {
                Write-Host "Cloning $org/$r @ $cand"
                git clone --depth 1 --branch $cand $url $r
                if ($LASTEXITCODE -ne 0) { throw "Failed to clone $r @ $cand" }
                $cloned = $true
                break
              }
            }
            if (-not $cloned) {
              Write-Host "Cloning $org/$r @ default branch"
              git clone --depth 1 $url $r
              if ($LASTEXITCODE -ne 0) { throw "Failed to clone $r" }
            }
          }


          # Ensure ReferencePath folders exist even before dependency builds
          New-Item -ItemType Directory -Force -Path "SAM_Windows\build" | Out-Null
          New-Item -ItemType Directory -Force -Path "SAM_UI\build"      | Out-Null

      - name: Restore + Rebuild in order (CI props like SAM_Deploy)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $repo = '${{ env.REPO_NAME }}'
          $windowsRef = (Resolve-Path 'SAM_Windows\build').Path
          $uiRef      = (Resolve-Path 'SAM_UI\build').Path

          # MSBuild treats semicolons in /p values specially.
          # Escape them so ReferencePath remains one property value without embedded quotes.
          $referencePathEscaped = "$windowsRef%3B$uiRef"
          Write-Host "ReferencePath=$windowsRef;$uiRef"

          $common = @(
            '/m:1'
            '/nr:false'
            '/v:m'
            '/p:Configuration=Release'
            '/p:UseSharedCompilation=false'
            '/p:RunPostBuildEvent=OnOutputUpdated'
            "/p:ReferencePath=$referencePathEscaped"
          )

          $buildOrder = @(
            'SAM'
            'SAM_Solver'
            'SAM_Systems'
            'SAM_Windows'
            'SAM_Mollier'
            'SAM_gbXML'
            'SAM_SolarCalculator'
            'SAM_Tas'
            'SAM_Excel'
            'SAM_GEM'
            'SAM_LadybugTools'
            'SAM_UI'
            $repo
          )

          $solutions = foreach ($r in $buildOrder) {
            $sln = Get-ChildItem -Path $r -Filter *.sln -File | Select-Object -First 1
            if (-not $sln) { throw "No .sln found under: $r" }
            $sln.FullName
          }

          foreach ($sln in $solutions) {
            Write-Host "==> Restore: $sln"
            & msbuild $sln /t:Restore @common
            if ($LASTEXITCODE -ne 0) { throw "Restore failed: $sln" }
          }

          foreach ($sln in $solutions) {
            Write-Host "==> Rebuild: $sln"
            & msbuild $sln /t:Rebuild @common
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $sln" }
          }

      - name: Upload build folders (optional)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPO_NAME }}-build-folders
          path: |
            **\build\*
          if-no-files-found: warn
