name: Build (Windows)

on:
  push:
    branches: [ "master", "main", "sow/**" ]
  pull_request:
    branches: [ "master", "main", "sow/**" ]
  workflow_dispatch:

jobs:
  build:
    # Run only in SAM-BIM org; skip fork PRs because secrets are not available there
    if: |
      github.repository_owner == 'SAM-BIM' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)

    runs-on: windows-2022

    env:
      MSBUILDDISABLENODEREUSE: "1"
      ORG_NAME: "SAM-BIM"
      REPO_NAME: "SAM_Rhino_UI"
      NUGET_XMLDOC_MODE: "skip"

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ${{ env.REPO_NAME }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Compute SAMVersion
        id: ver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Prefer head_ref when its a sow branch (release-promotion PRs from sow/* to main),
          # else use base_ref on PR events / ref_name on push events.
          $headRef = '${{ github.head_ref }}'
          $baseRef = '${{ github.base_ref }}'
          $refName = '${{ github.ref_name }}'
          if ($headRef -match '^sow/\d{4}-Q\d$') {
            $ref = $headRef
          } elseif ('${{ github.event_name }}' -eq 'pull_request') {
            $ref = $baseRef
          } else {
            $ref = $refName
          }
          # .NET AssemblyVersion components are UInt16 (max 65535). Cap to 60000 for headroom.
          $run = ${{ github.run_number }} % 60000
          if ($ref -match 'sow/(\d{4})-Q(\d)') {
            $v = "$($Matches[1]).$($Matches[2]).$run.0"
            $src = "branch '$ref'"
          } else {
            $now = (Get-Date).ToUniversalTime()
            $quarter = [int][Math]::Ceiling($now.Month / 3.0)
            $v = "$($now.Year).$quarter.$run.0"
            $src = "date $($now.ToString('yyyy-MM-dd')) (ref '$ref' not sow/yyyy-Qx)"
          }
          Write-Host "SAMVersion = $v (from $src)"
          "samversion=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Clone dependency repos (siblings)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.ORG_REPO_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:GH_TOKEN) {
            throw "Missing secret ORG_REPO_TOKEN. Add it in repo Settings -> Secrets and variables -> Actions."
          }

          $org   = '${{ env.ORG_NAME }}'
          $repo  = '${{ env.REPO_NAME }}'
          $token = $env:GH_TOKEN

          # Full dependency chain, plus private SAM_Solver.
          # Keep the current repo LAST.
          $buildOrder = @(
            'SAM'
            'SAM_Solver'
            'SAM_Mollier'
            'SAM_Systems'
            'SAM_Windows'
            'SAM_gbXML'
            'SAM_SolarCalculator'
            # Must precede SAM_Tas: SAM_Tas\benchmark\SAM.Analytical.Tas.Benchmark references
            # SAM_Validation\build\SAM.Analytical.Benchmark.dll by HintPath, and without it it fails
            # CS0234. Same slot as BuildAlls_v4.csproj uses locally. Needs only SAM and SAM_Mollier,
            # both already above.
            'SAM_Validation'
            'SAM_Tas'
            'SAM_Excel'
            'SAM_GEM'
            'SAM_LadybugTools'
            'SAM_UI'
            $repo
          )

          # Clone everything except the last one (already checked out by Actions)
          $deps = $buildOrder[0..($buildOrder.Count-2)]
          foreach ($r in $deps) {
            if (Test-Path $r) { continue }
            $headRef = '${{ github.head_ref }}'
            $baseRef = '${{ github.base_ref }}'
            $refName = '${{ github.ref_name }}'
            $candidates = @()
            if ($headRef) { $candidates += $headRef }
            # Current sow branch: base_ref on PR events, ref_name on push events.
            $sowRef = if ($baseRef -match '^sow/') { $baseRef } elseif ($refName -match '^sow/') { $refName } else { '' }
            if ($sowRef -and $sowRef -ne $headRef) { $candidates += $sowRef }
            $candidates += 'sow/2026-Q2'
            # Use the auth-token form so private deps (e.g. SAM_Solver) don't prompt
            $url = if ($token) { "https://$token@github.com/$org/$r.git" } else { "https://github.com/$org/$r.git" }
            $cloned = $false
            foreach ($cand in $candidates) {
              $has = (git ls-remote --heads $url $cand 2>$null | Out-String).Trim()
              if ($has) {
                Write-Host "Cloning $org/$r @ $cand"
                git clone --depth 1 --branch $cand $url $r
                if ($LASTEXITCODE -ne 0) { throw "Failed to clone $r @ $cand" }
                $cloned = $true
                break
              }
            }
            if (-not $cloned) {
              Write-Host "Cloning $org/$r @ default branch"
              git clone --depth 1 $url $r
              if ($LASTEXITCODE -ne 0) { throw "Failed to clone $r" }
            }
          }


          # Ensure ReferencePath folders exist even before dependency builds
          New-Item -ItemType Directory -Force -Path "SAM_Windows\build" | Out-Null
          New-Item -ItemType Directory -Force -Path "SAM_UI\build"      | Out-Null

      - name: Restore + Rebuild in order (CI props like SAM_Deploy)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $repo = '${{ env.REPO_NAME }}'
          $windowsRef = (Resolve-Path 'SAM_Windows\build').Path
          $uiRef      = (Resolve-Path 'SAM_UI\build').Path

          # MSBuild treats semicolons in /p values specially.
          # Escape them so ReferencePath remains one property value without embedded quotes.
          $referencePathEscaped = "$windowsRef%3B$uiRef"
          Write-Host "ReferencePath=$windowsRef;$uiRef"

          $common = @(
            '/m:1'
            '/nr:false'
            '/v:m'
            '/p:Configuration=Release'
            '/p:UseSharedCompilation=false'
            '/p:SAMVersion=${{ steps.ver.outputs.samversion }}'
            '/p:RunPostBuildEvent=OnOutputUpdated'
            "/p:ReferencePath=$referencePathEscaped"
          )

          $buildOrder = @(
            'SAM'
            'SAM_Solver'
            'SAM_Mollier'
            'SAM_Systems'
            'SAM_Windows'
            'SAM_gbXML'
            'SAM_SolarCalculator'
            # Must precede SAM_Tas: SAM_Tas\benchmark\SAM.Analytical.Tas.Benchmark references
            # SAM_Validation\build\SAM.Analytical.Benchmark.dll by HintPath, and without it it fails
            # CS0234. Same slot as BuildAlls_v4.csproj uses locally. Needs only SAM and SAM_Mollier,
            # both already above.
            'SAM_Validation'
            # Moved ABOVE SAM_Tas (it used to sit just below). SAM.Core.UI.WPF references
            # SAM_Excel\build\SAM.Core.Excel.dll and now has to be built before SAM_Tas - see
            # $preTasProjects. SAM_Excel's only dependency is SAM, so it is free to move up.
            'SAM_Excel'
            'SAM_Tas'
            'SAM_GEM'
            'SAM_LadybugTools'
            'SAM_UI'
            $repo
          )

          # Individual PROJECTS built immediately before SAM_Tas, and deliberately not the whole
          # SAM_UI solution. SAM.Analytical.Grasshopper.Tas (inside SAM_Tas.sln) references
          # SAM_UI\build\SAM.Core.UI.WPF.dll, but SAM_UI.sln as a whole references
          # SAM_Tas\build\*.dll - SAM.Analytical.UI and SAM.Analytical.UI.WPF both do. Building
          # all of SAM_UI here would be a circular dependency and cannot work.
          #
          # SAM.Core.UI.WPF is the break in that cycle: it has no SAM_Tas dependency, needs only
          # SAM\build\SAM.Core.dll and SAM_Excel\build\SAM.Core.Excel.dll, and pulls in
          # SAM.Core.UI through a ProjectReference - so building it alone produces both DLLs
          # SAM_Tas needs. SAM_UI still builds in full further down $buildOrder.
          #
          # The same pre-build exists in SAM_Tas and SAM_Revit_UI's build.yml and in the local
          # BuildAlls_v4.csproj; change all four together.
          $preTasProjects = @(
            'SAM_UI\WPF\SAM.Core.UI.WPF\SAM.Core.UI.WPF.csproj'
          )

          $solutions = foreach ($r in $buildOrder) {
            $sln = Get-ChildItem -Path $r -Filter *.sln -File | Select-Object -First 1
            if (-not $sln) { throw "No .sln found under: $r" }
            [pscustomobject]@{ Repo = $r; Path = $sln.FullName }
          }

          foreach ($entry in $solutions) {
            Write-Host "==> Restore: $($entry.Path)"
            & msbuild $entry.Path /t:Restore @common
            if ($LASTEXITCODE -ne 0) { throw "Restore failed: $($entry.Path)" }
          }

          foreach ($entry in $solutions) {
            # SAM_Tas cannot be built until SAM.Core.UI.WPF exists - see $preTasProjects.
            if ($entry.Repo -eq 'SAM_Tas') {
              foreach ($p in $preTasProjects) {
                if (-not (Test-Path $p)) { throw "Missing project: $p" }
                $proj = (Resolve-Path $p).Path
                Write-Host "==> Restore + Build (pre-Tas leaf): $proj"
                & msbuild $proj /t:Restore @common
                if ($LASTEXITCODE -ne 0) { throw "Restore failed: $proj" }
                & msbuild $proj /t:Build @common
                if ($LASTEXITCODE -ne 0) { throw "Build failed: $proj" }
              }
            }

            Write-Host "==> Rebuild: $($entry.Path)"
            & msbuild $entry.Path /t:Rebuild @common
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $($entry.Path)" }
          }

      - name: Upload build folders (optional)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPO_NAME }}-build-folders
          path: |
            **\build\*
          if-no-files-found: warn
